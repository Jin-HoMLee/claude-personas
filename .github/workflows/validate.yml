name: validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: configure git identity (for test repos created during init tests)
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI Runner"

      - name: claude-personas internal symlinks resolve
        run: |
          for role in developer pm designer scientist; do
            target=$(readlink "$role/shared")
            resolved="$role/$target"
            if [ ! -d "$resolved" ]; then
              echo "FAIL: $role/shared -> $target does not resolve"
              exit 1
            fi
            echo "OK: $role/shared -> $target"
          done

      - name: executable bit matches shebang (framework payload)
        run: |
          # Derived, not enumerated: for every tracked shell/python file under
          # framework/, the executable bit must match the file's contents.
          # A shebang'd script must be +x (it ships as runnable payload); a
          # shebang-less file (importable module, unittest test module) must
          # NOT be +x. Same invariant as pre-commit's
          # check-executables-have-shebangs + check-shebang-scripts-are-executable.
          # A new file added to framework/ is covered automatically - no list
          # to forget to update.
          fail=0
          for s in $(git ls-files 'framework/*.sh' 'framework/*.py'); do
            if head -c2 "$s" | grep -q '^#!'; then
              if [ -x "$s" ]; then
                echo "OK: $s (script, executable)"
              else
                echo "FAIL: $s has a shebang but is not executable (chmod +x)"
                fail=1
              fi
            else
              if [ -x "$s" ]; then
                echo "FAIL: $s is executable but has no shebang (chmod -x it, or add a shebang)"
                fail=1
              else
                echo "OK: $s (module, not executable)"
              fi
            fi
          done
          exit $fail

      - name: shellcheck (warning-severity gate on the shell payload + tests)
        run: |
          # Gate at warning severity: the payload must be warning-clean, with
          # intentional patterns carrying inline disable-with-rationale
          # directives. Info-level findings stay advisory (run shellcheck
          # locally without --severity to see them). -x follows source'd
          # helpers (test_helpers.sh).
          shellcheck --version
          shellcheck -x --severity=warning \
            framework/tools/*.sh framework/hooks/*.sh framework/tools/tests/*.sh

      - name: each role has MEMORY.md
        run: |
          for role in developer pm designer scientist shared; do
            if [ ! -f "$role/MEMORY.md" ]; then
              echo "FAIL: $role/MEMORY.md missing"
              exit 1
            fi
            echo "OK: $role/MEMORY.md exists"
          done

      - name: tier-1 size budgets (memory_cliff)
        run: |
          # Fails CI if any role's always-loaded load (role + shared) crosses the
          # documented cliff (14 rules / 200 lines / 4000 tokens). See CONVENTIONS.md
          # and issue #18.
          python3 framework/tools/memory_cliff.py

      - name: run tests
        run: bash framework/tools/tests/run_all.sh
