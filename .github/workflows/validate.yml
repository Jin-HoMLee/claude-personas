name: validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: configure git identity (for test repos created during init tests)
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI Runner"

      - name: claude-personas internal symlinks resolve
        run: |
          for role in developer pm designer scientist; do
            target=$(readlink "$role/shared")
            resolved="$role/$target"
            if [ ! -d "$resolved" ]; then
              echo "FAIL: $role/shared -> $target does not resolve"
              exit 1
            fi
            echo "OK: $role/shared -> $target"
          done

      - name: scripts are executable
        run: |
          for s in scripts/init-clone.sh scripts/list-roles.sh scripts/memory_cliff.py \
                   scripts/inject-role-index.sh scripts/doctor.sh \
                   scripts/tests/run_all.sh scripts/tests/test_memory_cliff.sh \
                   scripts/tests/test_doctor_manifest.sh scripts/tests/test_doctor_user_tier.sh \
                   scripts/tests/test_doctor_embedded.sh scripts/tests/test_doctor_role_clones.sh; do
            if [ ! -x "$s" ]; then
              echo "FAIL: $s is not executable"
              exit 1
            fi
            echo "OK: $s is executable"
          done

      - name: each role has MEMORY.md
        run: |
          for role in developer pm designer scientist shared; do
            if [ ! -f "$role/MEMORY.md" ]; then
              echo "FAIL: $role/MEMORY.md missing"
              exit 1
            fi
            echo "OK: $role/MEMORY.md exists"
          done

      - name: tier-1 size budgets (memory_cliff)
        run: |
          # Fails CI if any role's always-loaded load (role + shared) crosses the
          # documented cliff (14 rules / 200 lines / 4000 tokens). See CONVENTIONS.md
          # and issue #18.
          python3 scripts/memory_cliff.py

      - name: run tests
        run: bash scripts/tests/run_all.sh
